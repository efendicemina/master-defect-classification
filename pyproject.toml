[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-classifier"
version = "0.1.0"
description = "Reproducible research tooling for Eclipse bug severity classification"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved" }
authors = [{ name = "Emina Efendic Trapo" }]
dependencies = [
  "pyarrow>=19,<22",
  "scikit-learn>=1.7,<1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]
semantic = [
  "accelerate>=1.10,<2",
  "peft==0.19.1",
  "protobuf>=6,<7",
  "sentencepiece>=0.2,<1",
  "torch>=2.8,<3",
  "sentence-transformers>=5,<6",
  "transformers>=4.55,<6",
]

[project.scripts]
defect-classifier = "defect_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
